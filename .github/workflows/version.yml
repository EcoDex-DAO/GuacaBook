name: Validate and version main
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: guacabook-version-main
  cancel-in-progress: false
jobs:
  validate-and-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Increment only if this delivery has not already changed the version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: npm run version:auto -- "$PREVIOUS_SHA"
      - name: Publish version metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): increment application version [skip ci]"
          git push origin HEAD:main
